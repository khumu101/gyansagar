# nginx in front of gunicorn. Static files + protected media are served by nginx itself (fast);
# Django only decides *who* may download (login check) and hands the file to nginx via X-Accel-Redirect.

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream gyansagar_app {
    server web:8000;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 110m;          # a bit above RESOURCE_MAX_UPLOAD_MB (100)
    server_tokens off;

    # The host proxy (Caddy / Cloudflare / certbot-nginx) is the only thing talking to us.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 512;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Not reachable from outside: only Django can send people here through X-Accel-Redirect.
    location /protected-media/ {
        internal;
        alias /srv/media/;
    }

    location /media/ {
        return 404;                     # uploads are never public; they go through the login-checked view
    }

    location / {
        proxy_pass http://gyansagar_app;
        proxy_set_header Host $host;
        proxy_set_header X-Client-IP $remote_addr;     # overwritten here, so visitors cannot fake it
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 120s;
        proxy_redirect off;
    }
}
